<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impact | Admin Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin.css"></head><body>
<header class="admin-top"><a class="admin-brand" href="/">IMPACT <span>ADMIN</span></a><a href="/" class="back-link">← VIEW STORE</a></header>
<main class="admin-wrap"><section id="loginPanel" class="login-panel"><p class="eyebrow">SECURE ACCESS</p><h1>Welcome back.</h1><p class="muted">Sign in to manage your fragrance store.</p><form id="loginForm"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><p id="loginError" class="error"></p><button class="gold-btn">SIGN IN</button></form></section>
<section id="dashboard" hidden><div class="dash-head"><div><p class="eyebrow">STORE CONTROL</p><h1>Dashboard</h1></div><button id="logoutBtn" class="outline-btn">SIGN OUT</button></div>
<div class="tabs"><button class="tab active" data-tab="products">Products</button><button class="tab" data-tab="orders">Orders</button></div>
<div id="productsTab" class="tab-content"><div class="content-head"><h2>Product catalogue</h2><button id="newProductBtn" class="gold-btn">+ ADD PRODUCT</button></div><div id="productAdminList" class="admin-list"></div>
<div id="productEditor" class="editor" hidden><h3 id="editorTitle">Add a product</h3><form id="productForm" enctype="multipart/form-data"><input type="hidden" name="id"><label>Product name<input name="name" required></label><div class="form-grid"><label>Category<input name="category" value="Signature"></label><label>Price (₹)<input name="price" type="number" min="1" required></label><label>Original price (₹)<input name="oldPrice" type="number" min="0"></label><label>Product photo<input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label></div><label>Or image URL<input name="imageUrl" type="url" placeholder="https://..."></label><label>Description<textarea name="description" rows="3"></textarea></label><label class="check"><input name="featured" type="checkbox"> Feature this product</label><div class="editor-actions"><button class="gold-btn">SAVE PRODUCT</button><button type="button" id="cancelEdit" class="outline-btn">CANCEL</button></div><p id="productMessage" class="error"></p></form></div></div>
<div id="ordersTab" class="tab-content" hidden><div class="content-head"><h2>Customer orders</h2><button id="refreshOrders" class="outline-btn">REFRESH</button></div><div id="ordersList" class="admin-list"></div></div>
</section></main><div id="adminToast" class="toast"></div><script src="/admin.js"></script></body></html>
